[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quarkcosmos-levels"
version = "0.1.0"
description = "Moteur physique vulgarisé et générateur/validateur de niveaux — Quark & Cosmos"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["engine"]

[tool.setuptools.package-data]
engine = ["report_template.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
