name: level-engine

on:
  push:
    paths: ["stage3-physics-engine/**", ".github/workflows/level-engine.yml"]
  pull_request:
    paths: ["stage3-physics-engine/**", ".github/workflows/level-engine.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stage3-physics-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      # Solvabilité, 3 Photons, tolérance minimale, tap en vol, et JSON
      # commités identiques à la sortie du générateur (cf. tests/).
      - run: python -m pytest -q
