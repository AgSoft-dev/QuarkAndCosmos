name: android

on:
  push:
    paths: ["android/**", "content/**", "levels-builder/tests/golden/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "content/**", "levels-builder/tests/golden/**", ".github/workflows/android.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Kotlin physics replayed against the Python engine's golden trajectories,
      # then the debug APK (the Android SDK is preinstalled on ubuntu-latest).
      - run: ./gradlew --no-daemon :core-physics:test :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: quark-cosmos-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
